name: QuizPick Lite - seven day backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '42 1 * * *'

permissions:
  contents: write

concurrency:
  group: quizpick-lite-crawl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test all parsers
        run: python -m unittest discover -s tests -v
      - name: Backfill seven days from accessible original source
        run: python scraper/collect.py --days 7
      - name: Commit expanded JSON data
        run: |
          if ! git diff --quiet -- site/data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data.json
            git commit -m "chore(data): refresh permitted seven day public index"
            git push
          else
            echo "No JSON changes"
          fi
