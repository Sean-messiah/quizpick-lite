name: QuizPick Lite - extended quiz index refresh

on:
  workflow_dispatch:
  # Scheduled runs disabled: source returns HTTP 403 to GitHub Actions.
  # Re-enable only after an accessible, permitted data source is confirmed.

permissions:
  contents: write

concurrency:
  group: quizpick-lite-crawl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parsers
        run: python -m unittest discover -s tests -v
      - name: Collect extended quiz sources
        run: python scraper/collect_expanded.py
      - name: Commit JSON changes
        run: |
          if ! git diff --quiet -- site/data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data.json
            git commit -m "chore(data): refresh expanded app quiz index"
            git push
          else
            echo "No JSON changes"
          fi
