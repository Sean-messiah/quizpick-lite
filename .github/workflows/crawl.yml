name: QuizPick Lite - public quiz index refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: quizpick-lite-crawl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Collect public quiz pages
        run: python scraper/collect.py
      - name: Commit new JSON data
        run: |
          if ! git diff --quiet -- site/data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data.json
            git commit -m "chore(data): update daily quiz references"
            git push
          else
            echo "No JSON changes."
          fi
