name: Publish QuizPick Lite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/test_build_site.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['QuizPick Lite - public quiz index refresh', 'QuizPick Lite - extended quiz index refresh', 'QuizPick Lite - seven day backfill']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test page generator
        run: python -m unittest discover -s tests -p 'test_build_site.py' -v
      - name: Validate challenge scripts and curated feed
        run: |
          node --check site/assets/challenge.js
          node --check site/assets/app.js
          node --check site/assets/auth.js
          python -m json.tool site/manual-quizzes.json > /dev/null
          python -m json.tool site/auth-config.json > /dev/null
          if grep -Eq 'sb_secret_|service_role' site/auth-config.json; then
            echo "Forbidden secret credential marker in published auth configuration"
            exit 1
          fi
      - name: Build multi-page website
        run: python scripts/build_site.py
      - name: Verify output
        run: |
          test -f site/index.html
          test -f site/toss/index.html
          test -f site/kakaobank/index.html
          test -f site/apps/index.html
          test -f site/challenge/index.html
          test -f site/assets/auth.js
          test -f site/auth-config.json
          test -f site/guide/apptech-routine/index.html
          test -f site/sitemap.xml
          if grep -q 'data-copy-answer' site/index.html; then
            echo "ERROR: answers must not be on home"
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
